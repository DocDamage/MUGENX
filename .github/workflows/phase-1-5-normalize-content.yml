name: Phase 1-5 Normalize Active Content

on:
  push:
    branches:
      - phase-1-5-completion
    paths:
      - "tools/common/content_lint.py"
      - "tools/common/stage_integrity.py"
      - "tools/normalize_active_content.py"
      - ".github/workflows/phase-1-5-normalize-content.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase-1-5-normalize
  cancel-in-progress: true

jobs:
  normalize:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout active content
        uses: actions/checkout@v4
        with:
          ref: phase-1-5-completion
          fetch-depth: 1
          lfs: false
          sparse-checkout: |
            chars
            data
            stages
            tools
          sparse-checkout-cone-mode: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show normalization plan
        shell: pwsh
        run: python tools/normalize_active_content.py

      - name: Apply narrow normalization
        shell: pwsh
        run: python tools/normalize_active_content.py --write

      - name: Verify normalized active content
        shell: pwsh
        run: python tools/content_lint.py

      - name: Validate patch whitespace
        shell: pwsh
        run: git diff --check

      - name: Commit normalized content to implementation branch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- chars data/select.def
          if (git diff --cached --quiet) {
            Write-Host "No normalization changes to commit."
            exit 0
          }
          git commit -m "Normalize active content for runtime safety"
          git push origin HEAD:phase-1-5-completion
