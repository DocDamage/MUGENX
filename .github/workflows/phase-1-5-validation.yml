name: Phase 1-5 Static Validation

on:
  push:
    branches:
      - phase-1-5-completion
  pull_request:
    branches:
      - main
    paths:
      - "modules/**"
      - "tools/**"
      - "save/config.json"
      - "engine/save/config.json"
      - ".github/workflows/phase-1-5-validation.yml"

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout runtime and tooling only
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
          sparse-checkout: |
            modules
            tools
            save
            engine/save
          sparse-checkout-cone-mode: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Phase 1-5 self-check
        shell: pwsh
        run: python tools/phase_1_5_selfcheck.py --skip-content
